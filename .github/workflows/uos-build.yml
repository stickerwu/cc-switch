name: UOS Deb Build

on:
  push:
    branches:
      - uos
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uos-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-uos-deb:
    name: Build UOS amd64 deb
    runs-on: ubuntu-22.04
    container:
      image: debian:buster

    steps:
      - name: Prepare Debian buster build image
        shell: bash
        run: |
          set -euxo pipefail
          sed -i \
            -e 's|http://deb.debian.org/debian|http://archive.debian.org/debian|g' \
            -e 's|http://security.debian.org/debian-security|http://archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99no-check-valid-until
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            wget \
            git \
            xz-utils \
            python3 \
            perl \
            cmake \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            libxdo-dev \
            file \
            patchelf \
            xdg-utils

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        shell: bash
        run: |
          set -euxo pipefail
          npm install -g pnpm@10.12.3
          node --version
          npm --version
          pnpm --version
          rustc --version

      - name: Verify UOS-compatible system libraries
        shell: bash
        run: |
          set -euxo pipefail
          pkg-config --modversion gtk+-3.0
          pkg-config --modversion webkit2gtk-4.0
          pkg-config --modversion ayatana-appindicator3-0.1
          ldd --version

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build UOS deb
        shell: bash
        env:
          CI: true
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          set +e
          pnpm tauri build --bundles deb 2>&1 | tee release-assets/build.log
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "## UOS deb build failed"
              echo
              echo "Exit code: \`$status\`"
              echo
              echo '```text'
              tail -n 160 release-assets/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail_text="$(tail -n 160 release-assets/build.log)"
            tail_text="${tail_text//'%'/'%25'}"
            tail_text="${tail_text//$'\r'/'%0D'}"
            tail_text="${tail_text//$'\n'/'%0A'}"
            echo "::error title=UOS deb build failed::$tail_text"
            exit "$status"
          fi

      - name: Collect and verify deb
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="$(node -p "require('./package.json').version")"
          DEB="$(find src-tauri/target/release/bundle -name '*.deb' -type f | head -1)"
          test -n "$DEB"
          CONTROL="$(dpkg-deb -I "$DEB")"
          printf '%s\n' "$CONTROL" | tee release-assets/control.txt
          printf '%s\n' "$CONTROL" | grep -E 'Depends: .*libwebkit2gtk-4\.0'
          printf '%s\n' "$CONTROL" | grep -E 'Depends: .*libayatana-appindicator3'
          cp "$DEB" "release-assets/CC-Switch-v${VERSION}-UOS-amd64.deb"
          sha256sum release-assets/* | tee release-assets/SHA256SUMS

      - name: Upload UOS deb artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-uos-amd64
          path: release-assets/*
          if-no-files-found: warn
