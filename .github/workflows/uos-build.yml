name: UOS Deb Build

on:
  push:
    branches:
      - uos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uos-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-uos-deb:
    name: Build UOS amd64 deb
    runs-on: ubuntu-22.04
    container:
      image: debian:buster

    steps:
      - name: Prepare Debian buster build image
        shell: bash
        run: |
          set -euxo pipefail
          sed -i \
            -e 's|http://deb.debian.org/debian|http://archive.debian.org/debian|g' \
            -e 's|http://security.debian.org/debian-security|http://archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99no-check-valid-until
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            wget \
            git \
            xz-utils \
            python3 \
            perl \
            cmake \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.0-dev \
            libsoup2.4-dev \
            libxdo-dev \
            file \
            patchelf \
            xdg-utils

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        shell: bash
        run: |
          set -euxo pipefail
          npm install -g pnpm@10.12.3
          node --version
          npm --version
          pnpm --version
          rustc --version

      - name: Verify UOS-compatible system libraries
        shell: bash
        run: |
          set -euxo pipefail
          pkg-config --modversion gtk+-3.0
          pkg-config --modversion webkit2gtk-4.0
          pkg-config --modversion ayatana-appindicator3-0.1
          ldd --version

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build UOS deb
        shell: bash
        env:
          CI: true
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          set +e
          pnpm tauri build --bundles deb 2>&1 | tee release-assets/build.log
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            awk '
              {
                clean = $0
                gsub(/\033\[[0-9;]*[[:alpha:]]/, "", clean)
              }
              clean ~ /error|could not compile|failed to build app/ {
                for (i = NR - 8; i <= NR + 30; i++) want[i] = 1
              }
              { lines[NR] = $0 }
              END {
                for (i = 1; i <= NR; i++) {
                  if (want[i]) print lines[i]
                }
              }
            ' release-assets/build.log | tail -n 200 > release-assets/error-excerpt.log
            if [ ! -s release-assets/error-excerpt.log ]; then
              tail -n 160 release-assets/build.log > release-assets/error-excerpt.log
            fi
            {
              echo "## UOS deb build failed"
              echo
              echo "Exit code: \`$status\`"
              echo
              echo '```text'
              cat release-assets/error-excerpt.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail_text="$(cat release-assets/error-excerpt.log)"
            tail_text="${tail_text//'%'/'%25'}"
            tail_text="${tail_text//$'\r'/'%0D'}"
            tail_text="${tail_text//$'\n'/'%0A'}"
            echo "::error title=UOS deb build failed::$tail_text"
            exit "$status"
          fi

      - name: Collect and verify deb
        id: package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="v${VERSION}-uos.${GITHUB_RUN_NUMBER}"
          DEB="$(find src-tauri/target/release/bundle -name '*.deb' -type f | head -1)"
          test -n "$DEB"
          CONTROL="$(dpkg-deb -I "$DEB")"
          printf '%s\n' "$CONTROL" | tee release-assets/control.txt
          printf '%s\n' "$CONTROL" | grep -E 'Depends: .*libwebkit2gtk-4\.0'
          printf '%s\n' "$CONTROL" | grep -E 'Depends: .*libayatana-appindicator3'
          PACKAGE="release-assets/CC-Switch-v${VERSION}-UOS-amd64.deb"
          cp "$DEB" "$PACKAGE"
          sha256sum "$PACKAGE" | tee release-assets/SHA256SUMS
          {
            echo "version=$VERSION"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Publish permanent UOS release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          name: CC Switch v${{ steps.package.outputs.version }} for UOS (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          prerelease: false
          body: |
            UOS amd64 package built from the dedicated `uos` branch.

            - Source commit: `${{ github.sha }}`
            - Build environment: Debian buster
            - WebKitGTK ABI: 4.0
            - Package type: Debian `.deb`

            Install with:

            ```bash
            sudo apt install ./CC-Switch-v${{ steps.package.outputs.version }}-UOS-amd64.deb
            ```
          files: |
            release-assets/*.deb
            release-assets/SHA256SUMS
            release-assets/control.txt
          fail_on_unmatched_files: true

      - name: Upload UOS deb artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-uos-amd64
          path: release-assets/*
          if-no-files-found: warn
